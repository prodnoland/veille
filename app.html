<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#235a97">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>VEILLE · à lire</title>
<style>
:root {
  --encre: #131417;
  --papier: #fdfcfa;
  --accent: #235a97;
  --accent-sombre: #173f6e;
  --accent-pale: #edf2f8;
  --gris: #6b6d72;
  --hairline: #dfdeda;
  --ok: #2e7d4f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { background: #e9e6e0; }
body {
  background: var(--papier);
  color: var(--encre);
  font-family: "Charter", "Bitstream Charter", "Georgia", serif;
  max-width: 680px;
  margin: 0 auto;
  min-height: 100vh;
  box-shadow: 0 0 34px rgba(20, 20, 20, 0.13);
  padding: 20px 18px calc(40px + env(safe-area-inset-bottom)) 18px;
}
.sans { font-family: "Avenir Next", "Avenir", -apple-system, "Segoe UI", sans-serif; }
header { text-align: center; margin-bottom: 14px; }
header h1 {
  font-weight: 900;
  font-size: 40px;
  letter-spacing: 0.02em;
  border-bottom: 3px solid var(--encre);
  padding-bottom: 8px;
}
.tabs { display: flex; gap: 8px; margin: 14px 0 6px 0; }
.tab {
  flex: 1;
  font-family: "Avenir Next", "Avenir", -apple-system, sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 10px 0;
  text-align: center;
  background: var(--accent-pale);
  color: var(--accent-sombre);
  border: none;
  cursor: pointer;
}
.tab.actif { background: var(--accent); color: #fff; }
.compteur { font-weight: 400; opacity: 0.8; }
#liste { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
.groupe-titre {
  font-family: "Avenir Next", "Avenir", -apple-system, sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gris);
  margin: 10px 0 0 0;
  padding-top: 12px;
  border-top: 1px solid var(--hairline);
}
.carte { background: var(--accent-pale); border-top: 3px solid var(--accent); padding: 14px 16px; }
.carte.lue { opacity: 0.72; border-top-color: var(--hairline); }
.domaine {
  font-family: "Avenir Next", "Avenir", -apple-system, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #fff;
  background: var(--encre);
  display: inline-block;
  padding: 3px 8px;
  margin-bottom: 8px;
}
.carte h2 { font-size: 18px; font-weight: 900; line-height: 1.22; margin-bottom: 6px; }
.carte h2 a { color: inherit; text-decoration: none; }
.accroche {
  font-family: "Avenir Next", "Avenir", -apple-system, sans-serif;
  font-size: 13px;
  color: var(--gris);
  line-height: 1.5;
  margin-bottom: 10px;
}
.actions { display: flex; gap: 8px; align-items: center; }
.btn {
  font-family: "Avenir Next", "Avenir", -apple-system, sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  border: 1.5px solid var(--hairline);
  background: var(--papier);
  color: var(--encre);
  padding: 7px 12px;
  cursor: pointer;
  border-radius: 0;
}
.btn.lire { border-color: var(--accent); color: var(--accent-sombre); }
.btn.fait { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.vote.on-plus { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.vote.on-moins { background: #8a2b1d; border-color: #8a2b1d; color: #fff; }
.vide {
  text-align: center;
  color: var(--gris);
  font-style: italic;
  padding: 40px 0;
}
footer { margin-top: 28px; text-align: center; }
#bilan {
  font-family: "Avenir Next", "Avenir", -apple-system, sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-sombre);
  background: none;
  border: 1.5px solid var(--accent);
  padding: 9px 16px;
  cursor: pointer;
}
#bilan-zone {
  width: 100%;
  margin-top: 10px;
  font-family: "Menlo", monospace;
  font-size: 11px;
  min-height: 120px;
  display: none;
  padding: 8px;
  border: 1px solid var(--hairline);
}
.note {
  font-family: "Avenir Next", "Avenir", -apple-system, sans-serif;
  font-size: 11px;
  color: var(--gris);
  margin-top: 10px;
}
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>VEILLE</h1>
</header>
<div class="tabs" role="tablist">
  <button class="tab actif" id="tab-alire" onclick="bascule('alire')">À lire <span class="compteur" id="c-alire"></span></button>
  <button class="tab" id="tab-lus" onclick="bascule('lus')">Lus <span class="compteur" id="c-lus"></span></button>
</div>
<div id="liste"></div>
<footer>
  <button id="bilan" onclick="exporterBilan()">Copier le bilan pour Claude</button>
  <textarea id="bilan-zone" readonly aria-label="Bilan de lecture"></textarea>
  <p class="note">Le bilan résume tes lectures et tes votes : colle-le dans une session
  Claude Code pour affiner les prochains numéros. Tout reste sur ton appareil.</p>
</footer>
<script>
"use strict";
const LS_READ = "veille.lus", LS_VOTE = "veille.votes";
let articles = [], onglet = "alire";
const lus = () => JSON.parse(localStorage.getItem(LS_READ) || "{}");
const votes = () => JSON.parse(localStorage.getItem(LS_VOTE) || "{}");
const save = (k, o) => localStorage.setItem(k, JSON.stringify(o));

function marquer(id, lu) {
  const l = lus();
  if (lu) l[id] = new Date().toISOString().slice(0, 10); else delete l[id];
  save(LS_READ, l);
  rendre();
}
function voter(id, v) {
  const o = votes();
  o[id] = (o[id] === v) ? 0 : v;   // re-cliquer annule
  if (!o[id]) delete o[id];
  save(LS_VOTE, o);
  rendre();
}
function bascule(t) {
  onglet = t;
  document.getElementById("tab-alire").classList.toggle("actif", t === "alire");
  document.getElementById("tab-lus").classList.toggle("actif", t === "lus");
  rendre();
}
function carte(a, estLu) {
  const v = votes()[a.id] || 0;
  return `<div class="carte${estLu ? " lue" : ""}">
    <span class="domaine">n°${a.numero} · ${a.domaine}</span>
    <h2><a href="${a.url}">${a.titre}</a></h2>
    <p class="accroche">${a.accroche}</p>
    <div class="actions">
      <a class="btn lire" href="${a.url}">Ouvrir</a>
      <button class="btn${estLu ? " fait" : ""}" onclick="marquer('${a.id}', ${!estLu})">${estLu ? "✓ Lu" : "Marquer lu"}</button>
      <button class="btn vote${v === 1 ? " on-plus" : ""}" onclick="voter('${a.id}', 1)" aria-label="J'aime">👍</button>
      <button class="btn vote${v === -1 ? " on-moins" : ""}" onclick="voter('${a.id}', -1)" aria-label="Je n'aime pas">👎</button>
    </div>
  </div>`;
}
function rendre() {
  const l = lus();
  const visibles = articles.filter(a => (onglet === "alire") !== (a.id in l));
  document.getElementById("c-alire").textContent =
    "(" + articles.filter(a => !(a.id in l)).length + ")";
  document.getElementById("c-lus").textContent =
    "(" + articles.filter(a => a.id in l).length + ")";
  const zone = document.getElementById("liste");
  if (!visibles.length) {
    zone.innerHTML = `<p class="vide">${onglet === "alire"
      ? "Tout est lu. Le prochain numéro arrive dimanche."
      : "Rien d'archivé pour l'instant."}</p>`;
    return;
  }
  let html = "", numCourant = null;
  for (const a of visibles) {
    if (a.numero !== numCourant) {
      numCourant = a.numero;
      html += `<p class="groupe-titre">Numéro ${a.numero} · ${a.date}</p>`;
    }
    html += carte(a, a.id in l);
  }
  zone.innerHTML = html;
}
function exporterBilan() {
  const l = lus(), v = votes();
  const nom = id => (articles.find(a => a.id === id) || { titre: id }).titre;
  const plus = Object.keys(v).filter(k => v[k] === 1).map(nom);
  const moins = Object.keys(v).filter(k => v[k] === -1).map(nom);
  const nonLus = articles.filter(a => !(a.id in l)).map(a => a.titre);
  const txt = [
    "Bilan de lecture VEILLE (" + new Date().toISOString().slice(0, 10) + ")",
    "Lus : " + Object.keys(l).length + "/" + articles.length,
    plus.length ? "👍 " + plus.join(" | ") : "👍 aucun",
    moins.length ? "👎 " + moins.join(" | ") : "👎 aucun",
    nonLus.length ? "Non lus : " + nonLus.join(" | ") : "Tout est lu.",
  ].join("\n");
  const zone = document.getElementById("bilan-zone");
  zone.style.display = "block";
  zone.value = txt;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => {
      document.getElementById("bilan").textContent = "Copié ✓";
      setTimeout(() => document.getElementById("bilan").textContent =
        "Copier le bilan pour Claude", 2000);
    });
  }
}
fetch("articles.json")
  .then(r => r.json())
  .then(data => { articles = data; rendre(); })
  .catch(() => {
    document.getElementById("liste").innerHTML =
      '<p class="vide">Impossible de charger le catalogue (articles.json).</p>';
  });
</script>
</body>
</html>
